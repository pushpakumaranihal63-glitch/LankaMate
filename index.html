<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LankaMate - Sri Lanka Travel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #0b6e4f;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 430px;
            padding: 90px 8%;
            background: linear-gradient(
                rgba(0,0,0,0.35),
                rgba(0,0,0,0.35)
            ),
            url("https://images.unsplash.com/photo-1586613836745-9c4f4e6f3e95?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
            color: white;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 21px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #f4b400;
            color: #222;
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .section {
            padding: 45px 8%;
        }

        .section h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .card-content {
            padding: 18px;
        }

        .card h3 {
            margin-bottom: 8px;
            color: #0b6e4f;
        }

        footer {
            background: #123;
            color: white;
            text-align: center;
            padding: 25px;
        }

            .cards {
